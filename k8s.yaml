    .ability-button { gap: 10px; padding: 12px; margin-top: 17px; border-radius: 11px; }
    .ability-icon { width: 36px; height: 36px; border-radius: 9px; font-size: 21px; }
    .ability-button b { font-size: 14px; }
    .ability-button small { margin-top: 4px; font-size: 12px; }
    .hero-modal-actions { margin-top: 17px; }
    .secondary-button { padding: 10px 14px; border-radius: 9px; font-size: 13px; }
    .sheet-card { max-height: min(82svh, 680px); }
    .reel-heading { margin-top: 19px; font-size: 14px; }
