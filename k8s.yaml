    /* v0.5: the cabinet is a touch-first game surface.  This final type-floor rule
       intentionally supersedes the compact legacy declarations and their media
       queries above: no visible copy is ever rendered below 16 CSS px (12 pt). */
    *:not(.sr-only), *:not(.sr-only)::before, *:not(.sr-only)::after { font-size: 16px !important; }

    /* Keep the important hierarchy, while still respecting the 16px minimum. */
    h1 { font-size: 26px !important; }
    h2 { font-size: 22px !important; }
    .brand-mark { font-size: 18px !important; }
    .brand-mark span:nth-child(2) { font-size: 22px !important; }
    .brand-copy > span, .top-stat i, .top-stat strong { font-size: 16px !important; }
    .top-stat strong { font-size: 19px !important; }
    .icon-button, .modal-close { font-size: 24px !important; }
    .floating-chip { font-size: 18px !important; }
    .round-chip { font-size: 24px !important; }

    /* Enemy and player status are intentionally just health bars in the scene. */
    .enemy-hud { width: min(72%, 340px); padding: 0; border: 0; background: transparent; box-shadow: none; backdrop-filter: none; }
    .enemy-hud-heading, .enemy-hud .hud-value, .player-hud-heading, .player-hud .hud-value { display: none !important; }
    .enemy-meter, .player-hud .meter { height: 14px; margin-top: 0; border: 2px solid rgba(5, 9, 25, .72); box-shadow: 0 3px 12px rgba(0, 0, 0, .35); }
    .player-hud { width: min(180px, 72%); padding: 0; border: 0; background: transparent; backdrop-filter: none; }
    .battle-callout { display: none; }

    /* Information controls live on the battle scene's left rail, not beneath it. */
    .quick-actions { position: absolute; z-index: 16; top: 50%; left: 10px; display: flex; flex-direction: column; gap: 12px; width: 52px; transform: translateY(-50%); }
    .quick-button { display: grid; place-items: center; width: 52px; height: 52px; min-width: 52px; padding: 0; border: 1px solid rgba(218, 231, 255, .32); border-radius: 14px; background: rgba(8, 14, 32, .72); color: var(--muted); cursor: pointer; }
    .quick-button:hover, .quick-button:focus-visible { border-color: var(--acid); color: var(--text); background: rgba(17, 29, 58, .9); }
    .quick-icon { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid rgba(217, 255, 104, .42); border-radius: 9px; color: var(--acid); background: rgba(217, 255, 104, .1); font-size: 24px !important; }

    /* Solid continuous drum: the water/submerged illusion comes from shading and
       scale, never from alpha revealing the battle scene beneath it. */
    .reel-stage { margin-inline: -2px; background: #0c1630; mask-image: none; }
    .reel-stage::before { background: linear-gradient(180deg, #080e22 0%, rgba(8, 14, 34, .58) 20%, transparent 36%, transparent 66%, rgba(8, 14, 34, .62) 82%, #080e22 100%), radial-gradient(ellipse 44% 75% at 50% 50%, transparent 0 42%, rgba(4, 9, 24, .42) 82%, rgba(3, 7, 19, .85) 100%); }
    .reels { mask-image: none; }
    .reel { background: linear-gradient(180deg, #0d1733 0%, #1b3766 22%, #4075b4 50%, #1b3766 78%, #0d1733 100%) !important; }
    .reel:nth-child(2) { background: linear-gradient(180deg, #0e1b3d 0%, #27518d 22%, #5b96d6 50%, #27518d 78%, #0e1b3d 100%) !important; }
    .reel-window { mask-image: none; }
    .reel::before { background: linear-gradient(180deg, #080e22 0%, rgba(8, 14, 34, .72) 54%, transparent 100%); }
    .reel::after { background: linear-gradient(0deg, #080e22 0%, rgba(8, 14, 34, .76) 54%, transparent 100%); }
    .reel + .reel { box-shadow: inset 1px 0 rgba(219, 235, 255, .13); }
    .payline { right: 0; left: 0; gap: 0; opacity: .58; }
    .payline i { height: 2px; background: linear-gradient(90deg, transparent, rgba(217, 255, 104, .72), transparent) !important; box-shadow: 0 0 7px rgba(217, 255, 104, .38); }
    .payline b { display: none !important; }
    .strip-symbol { font-size: 26px !important; }
    .reel-value .symbol-glyph { font-size: 52px !important; }
    .reel-value .symbol-name { font-size: 16px !important; }
    .lock-badge { font-size: 16px !important; }
    .reel.spinning .reel-strip { animation: cylinder-roll-fast .13s linear infinite; }
    .reel.spinning .reel-value { animation: cylinder-value-fast .11s linear infinite; }
    @keyframes cylinder-roll-fast { from { transform: translateY(-38px) rotateX(-14deg) scaleY(.82); } to { transform: translateY(108px) rotateX(14deg) scaleY(1.1); } }
    @keyframes cylinder-value-fast { 0%, 100% { transform: translateY(-12px) scaleY(.78); } 50% { transform: translateY(12px) scaleY(1.14); } }

    /* Each stop gets one local snap and one local spark burst. */
    .reel.locking { animation: reel-lock-snap .34s cubic-bezier(.2, 1.4, .35, 1) both; }
    @keyframes reel-lock-snap { 0% { transform: translateY(0) scaleY(1); filter: brightness(1); } 34% { transform: translateY(7px) scaleY(.91); filter: brightness(1.55); } 65% { transform: translateY(-4px) scaleY(1.04); filter: brightness(1.2); } 100% { transform: translateY(0) scaleY(1); filter: brightness(1); } }
    .reel-sparks { position: absolute; z-index: 10; inset: 50%; display: block; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .reel-sparks i, .reel-sparks b { position: absolute; display: block; width: 4px; height: 16px; border-radius: 999px; background: var(--gold); box-shadow: 0 0 10px var(--gold); transform-origin: 50% 100%; }
    .reel-sparks i:nth-child(1) { --spark-angle: -78deg; --spark-distance: 32px; }
    .reel-sparks i:nth-child(2) { --spark-angle: -24deg; --spark-distance: 42px; }
    .reel-sparks i:nth-child(3) { --spark-angle: 32deg; --spark-distance: 38px; }
    .reel-sparks i:nth-child(4) { --spark-angle: 82deg; --spark-distance: 28px; }
    .reel-sparks i { opacity: 0; transform: rotate(var(--spark-angle)) translateY(0); }
    .reel-sparks b { width: 13px; height: 13px; transform: translate(-50%, -50%) rotate(45deg); }
    .reel-sparks.burst { opacity: 1; }
    .reel-sparks.burst i { animation: spark-fly .42s ease-out both; }
    .reel-sparks.burst b { animation: spark-core .3s ease-out both; }
    @keyframes spark-fly { 0% { opacity: 0; transform: rotate(var(--spark-angle)) translateY(0) scale(.5); } 18% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--spark-angle)) translateY(calc(var(--spark-distance) * -1)) scale(.1); } }
    @keyframes spark-core { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(45deg) scale(.2); } 22% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(45deg) scale(1.9); } }

    /* The machine action row is 75% ATTACK / 25% dealer SKILL. */
    .spin-row { grid-template-columns: 3fr 1fr; gap: 10px; }
    .spin-button, .skill-button { min-height: 64px; touch-action: manipulation; user-select: none; }
    .spin-button { position: relative; overflow: hidden; }
    .spin-button strong { font-size: 24px !important; }
    .spin-button small { font-size: 16px !important; }
    .spin-button kbd { font-size: 16px !important; }
    .spin-button.idle-active { border-color: var(--gold); background: linear-gradient(105deg, #c7e95e, #fff0a0); }
    .hold-progress { position: absolute; right: 0; bottom: 0; left: 0; z-index: 0; width: var(--hold-progress, 0%); height: 7px; background: linear-gradient(90deg, var(--orange), var(--gold)); box-shadow: 0 0 15px var(--gold); pointer-events: none; transition: width .05s linear; }
    .spin-button > span:not(.hold-progress), .spin-button > kbd { position: relative; z-index: 1; }
    .skill-button { position: relative; justify-content: center; gap: 4px; min-width: 0; padding: 5px 3px; border-color: rgba(194, 157, 255, .54); background: linear-gradient(145deg, rgba(194, 157, 255, .19), rgba(40, 31, 73, .82)); text-align: center; }
    .skill-button:disabled { opacity: .6; }
    .skill-button .ability-icon { width: 30px; height: 30px; font-size: 20px !important; }
    .skill-copy { min-width: 0; }
    .skill-copy b { display: block; overflow: hidden; font-size: 16px !important; text-overflow: ellipsis; white-space: nowrap; }
    .skill-copy small { display: none; }
    .skill-button .quick-badge { top: 4px; right: 5px; font-size: 16px !important; }
    .result-banner { min-height: 48px; }
    .result-icon { font-size: 22px !important; }
    .result-banner strong, .result-banner p { font-size: 16px !important; }
    .battle-feedback .feedback-pop { font-size: 30px !important; }
    .battle-feedback .feedback-pop.jackpot { font-size: 36px !important; }

    /* Modal copy follows the same floor, including dynamically generated cards. */
    .modal-kicker, .modal-subtitle, .hero-copy h3, .hero-copy p, .hero-tag, .character-summary strong, .character-summary p, .modal-stat-line, .bar-label, .trait-box p, .tag, .ability-button b, .ability-button small, .secondary-button, .reel-heading, .reel-heading b, .odds-row, .odds-row strong, .microcopy, .combat-log li, .combat-log li .log-time, .jackpot-seal, .upgrade-card h3, .upgrade-card p, .upgrade-cost, .toast { font-size: 16px !important; }
    .modal-heading h2 { font-size: 28px !important; }
    .modal-close { width: 42px; height: 42px; }
    .avatar { font-size: 32px !important; }
    .ability-icon { font-size: 22px !important; }
    .odds-symbol { font-size: 24px !important; }
    .upgrade-icon { font-size: 26px !important; }

    /* Short screens hide secondary readouts rather than violating the type floor. */
    @media (max-height: 620px) {
      .machine-stats, .machine-caption span:nth-child(2), .result-banner p { display: none; }
      .machine-panel { flex-basis: clamp(220px, 43%, 286px); }
      .reel-stage { min-height: 76px; }
      .reel-value .symbol-glyph { font-size: 44px !important; }
    }
    @media (max-width: 350px) {
      .quick-actions { left: 6px; width: 46px; gap: 9px; }
      .quick-button { width: 46px; height: 46px; min-width: 46px; }
      .quick-icon { width: 28px; height: 28px; }
      .spin-row { grid-template-columns: 3fr 1fr; gap: 7px; }
      .skill-copy b { font-size: 16px !important; }
    }

    /* v0.6: keep the enlarged type inside the cabinet on short mobile screens. */
    .machine-panel {
      flex: 0 0 clamp(284px, 43%, 340px);
      min-height: 0;
      overflow: hidden;
      padding: 8px 10px 7px;
    }
    .machine-topline { flex: 0 0 auto; }
    .machine-title h2 { margin-top: 2px; font-size: 20px !important; line-height: 1; }
    .panel-kicker { line-height: 1; }
    .reel-stage { min-height: 78px; margin-top: 6px; margin-bottom: 4px; }
    .machine-caption { flex: 0 0 auto; min-height: 18px; font-size: 16px !important; line-height: 1.1; }
    .spin-row { flex: 0 0 52px; min-height: 52px; height: 52px; margin-top: 6px; gap: 7px; }
    .spin-button, .skill-button { min-height: 0; height: 52px; max-height: 52px; }
    .spin-button { padding: 3px 7px; }
    .spin-button strong { font-size: 20px !important; line-height: 1; }
    .spin-button small { margin-top: 3px; font-size: 16px !important; line-height: 1; }
    .spin-button kbd { font-size: 16px !important; }
    .skill-button { gap: 3px; padding: 3px 2px; }
    .skill-button .ability-icon { width: 27px; height: 27px; font-size: 18px !important; }
    .skill-copy b { font-size: 16px !important; line-height: 1; }
    .skill-button .quick-badge { top: 3px; right: 3px; font-size: 16px !important; }
    .result-banner { flex: 0 0 40px; min-height: 40px; height: 40px; margin-top: 5px; padding-top: 4px; overflow: hidden; }
    .result-icon { width: 28px; height: 28px; }
    .result-banner strong, .result-banner p { font-size: 16px !important; line-height: 1.05; }

    /* The fill and a large percentage label make a hold unmistakable without
       changing the button's hit target or hiding the attack affordance. */
    .hold-progress { top: 0; bottom: 0; height: auto; z-index: 0; opacity: .27; border-right: 2px solid rgba(255, 211, 108, .9); transition: width .05s linear; }
    .spin-button.holding::after { content: attr(data-hold-percent); position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; color: var(--ink); font: 800 20px/1 'DM Mono', monospace; letter-spacing: .04em; text-shadow: 0 1px 0 rgba(255,255,255,.55); pointer-events: none; }
    .spin-button > span:not(.hold-progress), .spin-button > kbd { z-index: 3; }

    /* The enemy remains a clean health bar in the scene; tapping its art opens the
       full card, which is kept inside the viewport by the modal sheet constraints. */
    .enemy-actor { cursor: pointer; }
    .enemy-actor:focus-visible { outline: 2px solid var(--acid); outline-offset: 5px; border-radius: 14px; }
    .enemy-info-card { width: min(100%, 420px); max-height: calc(100% - 32px); overflow: auto; padding: 16px; }
    .enemy-summary { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    .enemy-summary strong { display: block; font-size: 20px !important; line-height: 1.1; }
    .enemy-summary p { margin-top: 6px; color: var(--muted); font-size: 16px !important; line-height: 1.25; }
    .enemy-modal-art { position: relative; flex: 0 0 74px; width: 74px; height: 74px; filter: drop-shadow(0 8px 7px rgba(5, 9, 25, .45)); }
    .enemy-modal-art > span { position: absolute; display: block; }
    .enemy-modal-art .enemy-body { right: 21%; bottom: 10%; left: 21%; height: 55%; border-radius: 45% 45% 35% 40%; background: linear-gradient(140deg, #a7a6bd, #4d4a75 73%); }
    .enemy-modal-art .enemy-face { top: 18%; right: 28%; left: 28%; height: 34%; border-radius: 50% 50% 43% 43%; background: #bdb5cd; }
    .enemy-modal-art .enemy-face::before, .enemy-modal-art .enemy-face::after { content: ''; position: absolute; top: -9px; width: 15px; height: 15px; border-radius: 50% 50% 0 50%; background: #8d85aa; }
    .enemy-modal-art .enemy-face::before { left: -2px; transform: rotate(-23deg); }
    .enemy-modal-art .enemy-face::after { right: -2px; transform: scaleX(-1) rotate(-23deg); }
    .enemy-modal-art .enemy-accent { top: 36%; right: 40%; left: 40%; height: 7%; border-radius: 50%; background: #322144; box-shadow: 11px 0 #322144; }
    .enemy-modal-art.enemy-art-joker .enemy-body { bottom: 9%; height: 63%; border-radius: 46% 46% 24% 24%; background: linear-gradient(140deg, #f2c73f, #a52d59 50%, #27215d); }
    .enemy-modal-art.enemy-art-joker .enemy-face { background: #f8dac4; }
    .enemy-modal-art.enemy-art-skull .enemy-body { bottom: 8%; height: 60%; border-radius: 43% 43% 20% 20%; background: linear-gradient(145deg, #bce4e0, #638a9b 74%); }
    .enemy-modal-art.enemy-art-skull .enemy-face { top: 13%; right: 27%; left: 27%; height: 43%; border-radius: 46% 46% 35% 35%; background: #d7f0e3; }
    .enemy-modal-art.enemy-art-house .enemy-body { right: 20%; bottom: 7%; left: 20%; height: 68%; border-radius: 40% 40% 20% 20%; background: linear-gradient(145deg, #c99450, #51304e 68%); }
    .enemy-modal-art.enemy-art-house .enemy-face { top: 7%; right: 26%; left: 26%; height: 43%; background: #e7bd77; }
    .enemy-info-meter { height: 14px; margin-top: 14px; border: 2px solid rgba(5, 9, 25, .72); }
    .enemy-info-meter span { background: linear-gradient(90deg, #ff4d76, #ff9d71); box-shadow: 0 0 12px rgba(255, 91, 130, .65); }
    .enemy-reward-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 18px; margin-top: 16px; color: var(--dim); font-size: 16px !important; line-height: 1.1; }
    .enemy-reward-line b { color: var(--text); font-size: 16px !important; }

    @media (max-height: 620px) {
      .machine-panel { flex-basis: 230px; padding-top: 6px; padding-bottom: 5px; }
      .machine-title, .machine-stats, .machine-caption span:nth-child(2), .result-banner p { display: none; }
      .machine-topline { min-height: 0; }
      .reel-stage { min-height: 72px; margin-top: 4px; margin-bottom: 3px; }
      .spin-row { flex-basis: 50px; height: 50px; min-height: 50px; margin-top: 4px; }
      .spin-button, .skill-button { height: 50px; max-height: 50px; }
      .result-banner { flex-basis: 34px; height: 34px; min-height: 34px; margin-top: 3px; }
      .result-icon { width: 24px; height: 24px; }
    }
kind: ConfigMap
metadata:
  name: critical-spin
  namespace: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-spin
  namespace: agents
  labels:
    app.kubernetes.io/name: critical-spin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: critical-spin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: critical-spin
    spec:
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: web-assets
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-assets
          configMap:
            name: critical-spin
---
apiVersion: v1
kind: Service
metadata:
  name: critical-spin
  namespace: agents
  labels:
    app.kubernetes.io/name: critical-spin
spec:
  selector:
    app.kubernetes.io/name: critical-spin
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: critical-spin
  namespace: agents
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: internal
  tls:
    - hosts:
        - critical-spin.example.com
      secretName: critical-spin-tls
  rules:
    - host: critical-spin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: critical-spin
                port:
                  name: http
